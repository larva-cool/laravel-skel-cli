name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 静态检查 (go vet)
        run: go vet ./...

      - name: 构建 (go build)
        run: go build ./...

      - name: 单元测试 (go test)
        run: go test -race -cover ./...
