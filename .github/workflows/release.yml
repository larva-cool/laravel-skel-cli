name: Release

# 推送形如 v1.0.0 的标签时触发，自动构建跨平台二进制并发布 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 运行测试
        run: go test ./...

      - name: 构建跨平台二进制
        run: make release VERSION=${GITHUB_REF_NAME}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
